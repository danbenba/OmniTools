# ========================================================================
# File: .github/workflows/dotnet-desktop.yml
# ========================================================================
# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
#
# Ce workflow va :
#   - Restaurer, compiler, et tester votre projet .NET Desktop (WPF/WinForms).
#   - Publier l'application dans un dossier /publish.
#   - Uploader les artefacts compilés en tant qu’"Artifact" sur GitHub.
#
# NOTE:
#   - Il n'y a plus de référence au "Windows Application Packaging Project" (WAP).
#   - Vous pouvez adapter les chemins (Solution_Name, Project_Path...) en fonction
#     de la structure de votre dépôt.
#   - Les étapes de signature/certificat WAP sont supprimées pour un simple exécutable.
#
# ========================================================================

name: .NET Desktop (No WAP)

on:
  push:
    branches: [ "project" ]
  pull_request:
    branches: [ "project" ]

jobs:
  build:
    runs-on: windows-latest
    
    strategy:
      matrix:
        configuration: [ Debug, Release ]

    env:
      # Adaptez ces variables à la structure de votre solution
      Solution_Name: OmniTools.sln     # Nom du fichier .sln
      Project_Path: OmniTools.csproj   # Chemin du fichier .csproj principal

    steps:
      # 1) Récupère le code source
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2) Installe le .NET SDK souhaité (Ici .NET 9.x)
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      # 3) Ajoute MSBuild (nécessaire pour certains projets Desktop)
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      # 4) Restaure les dépendances NuGet pour la solution
      - name: Restore
        run: dotnet restore $env:Solution_Name

      # 5) Compile le projet
      - name: Build
        run: dotnet build $env:Solution_Name --configuration ${{ matrix.configuration }} --no-restore

      # 6) Lance les tests unitaires (adaptez le chemin du projet de tests si besoin)
      - name: Test
        run: dotnet test $env:Project_Path --configuration ${{ matrix.configuration }}

      # 7) Publie l'application (crée les fichiers prêts à l’exécution dans ./publish)
      - name: Publish
        run: dotnet publish $env:Project_Path --configuration ${{ matrix.configuration }} --output ./publish

      # 8) Charge le dossier de publication en tant qu’artefact pour le récupérer depuis GitHub
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: published-app
          path: ./publish
